name = "vidlun-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-28"
# node-app-attest verifies Apple's certificate chain with node's crypto,
# which workerd provides behind this flag.
compatibility_flags = ["nodejs_compat"]

# Per device, per minute. Generous for a person writing a journal and mean for
# anyone who found the URL: an entry costs two calls, a week's narrative one.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Secrets are set with `wrangler secret put`, never written here:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put TOKEN_SECRET


# Attested device keys and one-time challenges.
[[kv_namespaces]]
binding = "ATTEST"
id = "9bca7fd8b800425aaaf5e44e1fb65587"

# Feedback from the app is mailed on, never stored. The sender must be on this
# zone (Email Routing is on for vidlun.app). The recipient has to be one of
# the zone's *verified destination addresses* — the inbox support@vidlun.app
# routes to, not support@ itself: a routing address is not a destination, and
# sending to it fails with E_RECIPIENT_NOT_ALLOWED (measured 2026-09-04).
# The binding is pinned to that one address so no bug can mail anywhere else.
[[send_email]]
name = "EMAIL"
destination_address = "alexanderkharchenko02@gmail.com"

[vars]
FEEDBACK_TO = "alexanderkharchenko02@gmail.com"
